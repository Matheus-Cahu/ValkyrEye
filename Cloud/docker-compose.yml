services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-valkyreye}
      POSTGRES_USER: ${POSTGRES_USER:-valkyreye}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      # Exposto só na máquina local, para inspeção com psql.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  mqtt:
    image: eclipse-mosquitto:2.0.22
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/mosquitto/config/entrypoint.sh"]
    environment:
      MQTT_RADAR_PASSWORD: ${MQTT_RADAR_PASSWORD:?Defina MQTT_RADAR_PASSWORD no arquivo .env}
      MQTT_API_PASSWORD: ${MQTT_API_PASSWORD:?Defina MQTT_API_PASSWORD no arquivo .env}
    volumes:
      - ./mosquitto:/mosquitto/config:ro
      - mqttdata:/mosquitto/data
    ports:
      # Exposto na rede para os ESP32 alcançarem o broker.
      - "${MQTT_PORT:-1883}:1883"

  api:
    build: ./api
    restart: unless-stopped
    environment:
      PORT: 3000
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-valkyreye}
      PGUSER: ${POSTGRES_USER:-valkyreye}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
      # Imagens de satélite (opcional): chave da conta de serviço em ./secrets.
      GEE_PRIVATE_KEY_FILE: ${GEE_PRIVATE_KEY_FILE:-/run/secrets/gee/gee-service-account.json}
      GEE_PROJECT: ${GEE_PROJECT:-}
      MQTT_URL: mqtt://mqtt:1883
      MQTT_USERNAME: valkyreye-api
      MQTT_PASSWORD: ${MQTT_API_PASSWORD:?Defina MQTT_API_PASSWORD no arquivo .env}
    volumes:
      - ./secrets:/run/secrets/gee:ro
    ports:
      - "${API_PORT:-8080}:3000"
    depends_on:
      db:
        condition: service_healthy
      mqtt:
        condition: service_started

volumes:
  pgdata:
  mqttdata:
