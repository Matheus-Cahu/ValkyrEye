# Broker MQTT do ValkyrEye. Os radares (ESP32) publicam ocorrências e a API
# assina o tópico e grava no banco.

listener 1883
allow_anonymous false
# Gerado a cada inicialização por entrypoint.sh a partir do .env.
password_file /mosquitto/data/passwd
acl_file /mosquitto/data/acl

# Guarda sessões e mensagens QoS 1 pendentes (ex.: enquanto a API reinicia).
persistence true
persistence_location /mosquitto/data/
autosave_interval 60

# A assinatura tem no máximo 1000 tuplas; 256 KiB sobra.
max_packet_size 262144

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
